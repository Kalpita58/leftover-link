older="Describe the food and any facts that help a community partner decide whether it suits them."></textarea></div><div class="field wide"><label for="food-notes">Collection notes</label><textarea id="food-notes" name="notes" placeholder="Storage, allergen, or handoff details"></textarea></div><div class="form-action"><button class="btn" type="submit">${isPreview?'Add demo listing':'Publish offer'}</button><span class="form-help">${isPreview?'Saved only in this browser preview.':'Published to the offer board for nearby consumers.'}</span></div></form></section><aside class="card small-card"><h2>Good listing details</h2><p>Include an accurate quantity, a collection window, and any handling information that helps a partner decide whether the offer works for them.</p></aside></div>`;

    function adminInsightsView(){return `<section class="admin-insights"><h2>Ask AI about your data</h2><p>Ask about customers, restaurants, offers, and pickups using current MongoDB totals. “Pending orders” means claimed offers awaiting pickup in Leftover Link. Only your question is sent to Gemini; names, emails, and database records stay on this server.</p><form class="admin-insight-form" id="admin-insight-form"><input id="admin-question" name="question" type="text" maxlength="500" required placeholder="How many customers do we have?" aria-label="Ask a question about admin data" ${isPreview?'disabled':''}><button class="btn" type="submit" ${isPreview?'disabled':''}>Ask AI</button></form><div class="admin-prompt-list" aria-label="Example questions">${['How many customers are registered?','How many pickups are awaiting collection?','How many restaurants need review?','Give me an overview of all current totals.'].map(question=>`<button type="button" class="admin-prompt" data-admin-question="${escapeHTML(question)}" ${isPreview?'disabled':''}>${escapeHTML(question)}</button>`).join('')}</div><div class="admin-answer" id="admin-answer" role="status" aria-live="polite">${isPreview?'Sign in with an administrator account to ask about live database totals.':''}</div></section>`}
    function adminView(){
      if(currentView==='partners')return `<div class="card"><div class="card-head"><div><h2>Partner directory</h2><p>${isPreview?'Sample partner records in this preview workspace.':'Registered restaurant accounts.'}</p></div><input class="search" id="partner-search" style="max-width:230px;flex:0 1 230px" placeholder="Search partners" aria-label="Search partners"></div><div class="table-wrap"><table class="table"><thead><tr><th>Partner</th><th>Type</th><th>Area</th><th>Access</th></tr></thead><tbody id="partner-table">${adminPartners.map(partner=>`<tr><td>${escapeHTML(partner.organizationName||partner.name)}</td><td>${partner.role==='restaurant'?'Restaurant':'Consumer'}</td><td>${escapeHTML(partner.neighborhood||'—')}</td><td><span class="status ${partner.status==='active'?'':'pending'}">${escapeHTML(partner.status)}</span></td></tr>`).join('')}</tbody></table></div></div>`;

    function render(){

      wireCommon();

      if(currentRole==='restaurant'&&currentView==='listings')wireRestaurantListings();

      document.getElementById('offer-search').value=searchTerm;document.getElementById('offer-search').addEventListener('input',update);document.getElementById('sort-offers').addEventListener('change',update);content.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{activeFilter=button.dataset.filter;content.querySelectorAll('[data-filter]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));update()}));update();

    function readSessionList(key){try{return JSON.parse(sessionStorage.getItem(key)||'[]')}catch{return []}}
    function wireOfferActions(list){list.querySelectorAll('[data-save-id]').forEach(button=>{const id=String(button.dataset.saveId);const savedNow=()=>isPreview?readSessionList('ll-saved').map(String).includes(id):liveSavedOffers.some(item=>String(item.id)===id);button.textContent=savedNow()?(currentView==='saved'?'Remove':'Saved'):'Save';button.addEventListener('click',async()=>{if(isPreview){let saved=readSessionList('ll-saved').map(String);if(savedNow()){saved=saved.filter(value=>value!==id);say('Removed from saved offers.')}else{saved.push(id);say('Offer saved in this browser session.')}sessionStorage.setItem('ll-saved',JSON.stringify(saved))}else{button.disabled=true;try{await apiRequest(`/api/offers/${encodeURIComponent(id)}/saved`,{method:'PUT',body:JSON.stringify({saved:!savedNow()})});if(savedNow()){liveSavedOffers=liveSavedOffers.filter(item=>String(item.id)!==id);say('Removed from saved offers.')}else{const item=listings.find(row=>String(row.id)===id);if(item)liveSavedOffers.push(item);say('Offer saved to your account.')}}catch(error){say(error.message);button.disabled=false;return}}if(currentView==='saved')renderSaved();else{button.textContent=savedNow()?'Saved':'Save';button.disabled=false}})});list.querySelectorAll('[data-plan-id]').forEach(button=>button.addEventListener('click',async()=>{const id=String(button.dataset.planId);if(isPreview){const plans=readSessionList('ll-collections').map(String);if(!plans.includes(id)){plans.push(id);sessionStorage.setItem('ll-collections',JSON.stringify(plans))}button.textContent='Planned';button.disabled=true;say('Pickup added to My collections for this preview. No reservation was sent.');return}button.disabled=true;try{const result=await apiRequest(`/api/offers/${encodeURIComponent(id)}/claim`,{method:'POST',body:JSON.stringify({})});const item=mapOffer(result.claim);liveClaims=[item,...liveClaims.filter(row=>String(row.id)!==id)];listings=listings.filter(row=>String(row.id)!==id);say('Offer claimed. It is now in My collections.');setView('collections')}catch(error){button.disabled=false;say(error.message)}}))}

    function renderCollections(){const list=document.getElementById('collection-list');if(isPreview){const selected=readSessionList('ll-collections').map(String);list.innerHTML=consumerListings(listings.filter(item=>selected.includes(String(item.id))),'collections');return}list.innerHTML='<div class="empty">Loading your pickups…</div>';apiRequest('/api/offers/claims/mine').then(data=>{if(currentRole!=='consumer'||currentView!=='collections')return;liveClaims=data.claims.map(mapOffer);list.innerHTML=consumerListings(liveClaims,'collections')}).catch(error=>{list.innerHTML=`<div class="empty">${escapeHTML(error.message)}</div>`})}
    function localPickupTime(time,dayOffset=0){const date=new Date();date.setDate(date.getDate()+dayOffset);const [hours,minutes]=time.split(':').map(Number);date.setHours(hours,minutes,0,0);return date.toISOString()}
    function wireNewListing(){
      const form=document.getElementById('new-listing');
      const aiButton=document.getElementById('ai-draft');
      if(aiButton)aiButton.addEventListener('click',async()=>{
        const data=new FormData(form);const status=document.getElementById('ai-status');
        aiButton.disabled=true;status.textContent='Creating a draft…';
        const category={'Produce':'produce','Prepared meals':'prepared-meals','Bakery':'bakery','Other':'other'}[data.get('kind')];
        try{const result=await apiRequest('/api/ai/listing-draft',{method:'POST',body:JSON.stringify({title:data.get('title'),category,quantity:data.get('quantity'),neighborhood:data.get('neighborhood'),description:data.get('description'),handlingNotes:data.get('notes')})});
          if(result.title)form.elements.title.value=result.title;
          if(result.description)form.elements.description.value=result.description;
          status.textContent='Draft ready. Review it, then publish when it looks right.';
        }catch(error){status.textContent=error.message}finally{aiButton.disabled=false}
      });
      form.addEventListener('submit',async event=>{event.preventDefault();const data=new FormData(event.currentTarget);const title=data.get('title');const start=data.get('start');const end=data.get('end');const endOffset=end<=start?1:0;const time=`Today · ${start}–${end}`;if(isPreview){const row={id:Date.now(),title,kind:data.get('kind'),place:`${data.get('neighborhood')} · Your restaurant`,time,quantity:data.get('quantity'),art:String(title).slice(0,1).toUpperCase(),tone:'grey'};listings.unshift(row);restaurantEntries.unshift({title,window:time,status:'Available'});say('Demo listing added for this page session.');setView('listings');return}const submit=event.currentTarget.querySelector('[type="submit"]');submit.disabled=true;const category={'Produce':'produce','Prepared meals':'prepared-meals','Bakery':'bakery','Other':'other'}[data.get('kind')];try{const result=await apiRequest('/api/offers',{method:'POST',body:JSON.stringify({title,description:data.get('description'),category,quantity:data.get('quantity'),neighborhood:data.get('neighborhood'),pickupStartsAt:localPickupTime(start),pickupEndsAt:localPickupTime(end,endOffset),handlingNotes:data.get('notes')})});const row=mapOffer(result.offer);listings.unshift(row);restaurantEntries.unshift({id:row.id,title:row.title,window:row.time,status:'Available'});say('Offer published to the live food board.');setView('listings')}catch(error){say(error.message);submit.disabled=false}})
    }
    function wireRestaurantListings(){content.querySelectorAll('[data-close-index]').forEach(button=>button.addEventListener('click',async()=>{const item=restaurantEntries[Number(button.dataset.closeIndex)];if(!item)return;const status=item.status==='Pickup confirmed'?'collected':'closed';if(isPreview){item.status=status==='collected'?'Collected':'Closed';say('Listing status updated in this demo.');render();return}button.disabled=true;try{await apiRequest(`/api/offers/${encodeURIComponent(item.id)}/status`,{method:'PATCH',body:JSON.stringify({status})});item.status=status==='collected'?'Collected':'Closed';say('Listing status updated.');render()}catch(error){button.disabled=false;say(error.message)}}))}
    function wireReviews(){const filter=document.getElementById('review-filter');filter.addEventListener('change',()=>document.querySelectorAll('[data-review-row]').forEach(row=>row.hidden=filter.value!=='All'&&row.dataset.status!==filter.value));content.querySelectorAll('[data-review]').forEach(button=>button.addEventListener('click',async()=>{const id=button.dataset.partnerId;const status=button.dataset.review;button.disabled=true;try{if(!isPreview)await apiRequest(`/api/admin/partners/${encodeURIComponent(id)}/status`,{method:'PATCH',body:JSON.stringify({status})});const partner=adminPartners.find(item=>String(item.id||item._id)===String(id));if(partner)partner.status=status;partnerApplications=adminPartners.filter(item=>item.status==='pending'||item.status==='needs-information'||item.status==='active'||item.status==='rejected');say(`${status==='active'?'Restaurant approved':status==='needs-information'?'More information requested':status==='suspended'?'Access suspended':'Application declined'}${isPreview?' in this preview.':'.'}`);render()}catch(error){button.disabled=false;say(error.message)}}))}
    function wirePartnerSearch(){document.getElementById('partner-search').addEventListener('input',event=>{const query=event.target.value.toLowerCase();document.querySelectorAll('#partner-table tr').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(query))})}
    function wireAdminInsights(){
      const form=document.getElementById('admin-insight-form');
      const input=document.getElementById('admin-question');
      const answer=document.getElementById('admin-answer');
      form.addEventListener('submit',async event=>{
        event.preventDefault();
        const button=form.querySelector('[type="submit"]');
        button.disabled=true;answer.textContent='Checking the live database totals…';
        try{const result=await apiRequest('/api/ai/admin-insights',{method:'POST',body:JSON.stringify({question:input.value})});answer.textContent=result.answer}
        catch(error){answer.textContent=error.message}
        finally{button.disabled=false}
      });
      content.querySelectorAll('[data-admin-question]').forEach(button=>button.addEventListener('click',()=>{input.value=button.dataset.adminQuestion;form.requestSubmit()}));
    }
    roles.forEach(button=>button.addEventListener('click',()=>setRole(button.dataset.role)));
    document.getElementById('switch-role').addEventListener('click',async event=>{if(isPreview)return;event.preventDefault();try{await apiRequest('/api/auth/logout',{method:'POST',body:JSON.stringify({})})}catch(error){say(error.message);return}window.location.assign(`login.html?role=${currentRole}`)});
    async function initialize(){const requested=new URLSearchParams(location.search).get('role');try{const response=await fetch('/api/auth/me',{credentials:'same-origin'});if(response.ok){const data=await response.json();signedInUser=data.user;isPreview=false;await loadAccountData(signedInUser.role)}}catch{}const role=signedInUser?.role||(['consumer','restaurant','administrator'].includes(requested)?requested:'consumer');setRole(role)}
    initialize();
  })();
  </script>
</body>
</html>
